name: Run Analysis Pipeline

on:
  push:
    branches: [submission/jonas-denck]
  workflow_dispatch:

jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unzip synthetic data
        run: unzip -o synthetic_data.zip -d synthetic_data/

      - name: Run Task 1 — Adoption modelling
        run: |
          source .venv/bin/activate
          python scripts/task1_adoption/run_task1.py

      - name: Run Task 2 — TAM estimation
        run: |
          source .venv/bin/activate
          python scripts/task2_tam/run_task2.py

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: analysis-outputs
          path: outputs/

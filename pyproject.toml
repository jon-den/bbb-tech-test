[tool.pytest.ini_options]
# Silence third-party deprecation noise; still surface warnings from our code.
filterwarnings = [
    "ignore::FutureWarning:sklearn.*",
    "ignore::UserWarning:sklearn.*",
    "ignore::DeprecationWarning:pkg_resources.*",
]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, undefined names)
    "I",   # isort
    "D",   # pydocstyle (docstring format — Google convention via [lint.pydocstyle])
]
extend-ignore = [
    "D100",  # missing docstring in public module — not required
    "D104",  # missing docstring in public package — not required
    "D105",  # missing docstring in magic method — not required
    "D107",  # missing docstring in __init__ — not required
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D101", "D102", "D103"]
"scripts/**" = ["D103", "E501"]
"notebooks/**" = ["D103", "E501"]

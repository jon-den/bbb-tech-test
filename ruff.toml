line-length = 100

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, undefined names)
    "I",   # isort
    "D",   # pydocstyle (docstring format — Google convention via [lint.pydocstyle])
]
extend-ignore = [
    "D100",  # missing docstring in public module — not required
    "D104",  # missing docstring in public package — not required
    "D105",  # missing docstring in magic method — not required
    "D107",  # missing docstring in __init__ — not required
]

[lint.pydocstyle]
convention = "google"

[lint.per-file-ignores]
"tests/**" = ["D101", "D102", "D103"]  # no docstrings required in test classes/methods
"scripts/**" = ["D103", "E501"]       # runner scripts: entry points, long print f-strings are intentional
"notebooks/**" = ["D103", "E501"]     # notebooks are exploratory; long chains are fine

